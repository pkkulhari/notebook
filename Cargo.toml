[workspace]
resolver = "3"
members = ["crates/core", "crates/gtk", "crates/ffi"]
default-members = ["crates/core", "crates/gtk"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
notebook-core = { path = "crates/core" }
rusqlite = { version = "0.38", features = ["bundled"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0

[profile.release]
strip = true

# The Android app's library. Panics keep unwinding: UniFFI turns them into
# Kotlin exceptions, and iroh's DNS resolver recovers from one. Optimizing for
# size saves about 2 MB; parsing and typing were about 10% slower in a host
# benchmark, still well within budget (docs/android/11-release.md).
[profile.android]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
