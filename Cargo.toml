[workspace]
resolver = "3"
members = ["crates/core", "crates/gtk"]
default-members = ["crates/core", "crates/gtk"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
notebook-core = { path = "crates/core" }
rusqlite = { version = "0.38", features = ["bundled"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0

[profile.release]
strip = true
